# Target machine
MACHINE ?= "raspberrypi4-64"

# Use Poky as base distribution
DISTRO ?= "poky"

# systemd as init system
DISTRO_FEATURES:append = " systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"
DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " sysvinit"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

# Enable the Pi camera via v4l2
MACHINE_FEATURES:append = " camera"
VIDEO_CAMERA = "1"

# Package format
PACKAGE_CLASSES ?= "package_rpm"

# Enable debug tweaks during development (removes root password etc.)
EXTRA_IMAGE_FEATURES ?= "debug-tweaks"

# Download and sstate cache directories (adjust to your paths)
DL_DIR ?= "${TOPDIR}/../downloads"
SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

# Parallelism
BB_NUMBER_THREADS ?= "4"
PARALLEL_MAKE ?= "-j4"

# Larger rootfs needed for Python + OpenCV
IMAGE_ROOTFS_SIZE = "2097152"

BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
"

CONF_VERSION = "2"
